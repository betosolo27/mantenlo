<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f2d55"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"><title>MANTENLO — Socio</title><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<style>
.request-media{margin:14px 0;padding:13px;border:1px solid #e3eaf1;border-radius:17px;background:#f8fafc}
.request-media-head{display:flex;align-items:center;gap:7px;margin-bottom:10px;color:#173650;font-size:12px}
.request-media-head svg{width:17px;height:17px;color:#147ac5}
.request-media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.request-media-item{position:relative;aspect-ratio:1;border-radius:13px;overflow:hidden;background:#eaf0f5;border:0;padding:0;cursor:pointer}
.request-media-item img,.request-media-item video{width:100%;height:100%;object-fit:cover;display:block}
.request-media-item .play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(7,28,48,.20);color:white}
.request-media-item .play svg{width:30px;height:30px}
.media-modal{position:fixed;inset:0;z-index:9999;background:rgba(4,17,30,.88);display:flex;align-items:center;justify-content:center;padding:18px}
.media-modal-inner{position:relative;width:min(720px,100%);max-height:90vh;display:flex;align-items:center;justify-content:center}
.media-modal img,.media-modal video{max-width:100%;max-height:85vh;border-radius:16px;background:#000}
.media-close{position:absolute;right:-4px;top:-46px;width:38px;height:38px;border:0;border-radius:50%;background:white;color:#102d49;font-size:24px;cursor:pointer}
</style>
</head><body><header class="top"><div class="brand">MANT<span>ENLO</span></div><nav class="links"><a href="cliente.html">Cliente</a><a class="active" href="socio.html">Socio</a><a href="admin.html">Admin</a></nav></header><div class="wrap"><div class="phone"><div class="main"><div class="status">● CONECTADO A LA NUBE</div><h1 class="title">MANTENLO SOCIO</h1><p class="subtitle">Solicitudes reales del MVP.</p><div id="requests"><div class="empty">Cargando...</div></div></div></div></div><script src="app.js?v=20260922-media1"></script><script>
let partners=[];let mediaByRequest={};async function renderRequests(force=false){if(!force&&document.querySelector('.quote-form'))return;const el=document.getElementById('requests');try{if(!partners.length)partners=await getPartners();const rs=(await getRequests()).filter(r=>!['completed','cancelled','quote_rejected'].includes(String(r.status||'').trim().toLowerCase()));if(!rs.length){el.innerHTML='<div class="empty">No hay solicitudes pendientes. Crea una desde Cliente en otro dispositivo.</div>';return}const mediaLists=await Promise.all(rs.map(async r=>{try{return await getServiceMedia(r.id)}catch(e){console.warn('No se pudo cargar multimedia',e);return []}}));mediaByRequest={};rs.forEach((r,i)=>mediaByRequest[r.id]=mediaLists[i]||[]);el.innerHTML=rs.map(r=>card(r)).join('');if(window.lucide)lucide.createIcons()}catch(e){el.innerHTML='<div class="empty">Error al conectar: '+esc(e.message)+'</div>'}}
function card(r){const st=String(r.status||'').trim().toLowerCase();let action='';if(st==='searching')action=`<button class="primary" onclick="accept('${r.id}','${esc(r.category)}')">Aceptar servicio</button>`;else if(['assigned','accepted','on_the_way'].includes(st))action=`<div style="margin-top:14px"><button class="primary" onclick="arrive('${r.id}')">Ya llegué al domicilio</button></div>`;else if(st==='arrived')action=`<div class="quote-form"><label class="label">Diagnóstico</label><textarea class="textarea" id="diag-${r.id}" rows="2" placeholder="Ej. Fuga en conexión de tubería">${esc(r.description||'')}</textarea><label class="label">Mano de obra</label><input class="input" id="labor-${r.id}" type="number" inputmode="decimal" value="600"><label class="label">Materiales</label><input class="input" id="materials-${r.id}" type="number" inputmode="decimal" value="180"><button class="primary" onclick="sendQuote('${r.id}',${Number(r.visit_fee||199)})">Enviar cotización al cliente</button></div>`;else if(st==='quoted')action=`<div class="notice"><b>Cotización enviada.</b><br>Esperando autorización del cliente.</div>`;
else if(st==='quote_rejected')action=`<div class="notice"><b>Cotización rechazada.</b><br>El cliente decidió no realizar el trabajo.<br><b>Visita a cobrar: ${money(r.visit_fee||199)}</b></div>`;else if(st==='authorized')action=`<button class="primary" onclick="startWork('${r.id}')">Iniciar trabajo</button>`;else if(st==='in_progress')action=`<button class="primary" onclick="completeWork('${r.id}')">Marcar servicio terminado</button>`;return `<div class="option"><div style="display:flex;justify-content:space-between;gap:8px"><b>🚨 ${esc(r.category)}</b><span class="badge">${esc(statusLabel[st]||r.status)}</span></div><p><b>${esc(r.problem)}</b></p><span class="pill">${esc(r.address||'Zapopan')} · Visita ${money(r.visit_fee||199)}</span>${r.service_timing&&r.service_timing!=='now'?`<p class="pill"><b>🗓 ${r.service_timing==='today'?'Hoy':esc(r.scheduled_date||'Programado')} · ${esc((r.time_from||'').slice(0,5))}–${esc((r.time_to||'').slice(0,5))}</b></p>`:''}${r.assigned_partner_id?`<p class="pill">Socio: ${esc(r.partners?.name||'asignado')}</p>`:''}${requestMediaMarkup(r.id)}${action}</div>`}

function requestMediaMarkup(id){
  const items=mediaByRequest[id]||[];
  if(!items.length)return '';
  return `<section class="request-media"><div class="request-media-head"><i data-lucide="images"></i><b>Fotos y video del problema</b></div><div class="request-media-grid">${items.map(m=>m.media_type==='video'?`<button type="button" class="request-media-item" onclick="openRequestMedia('video','${encodeURIComponent(m.file_url)}')"><video src="${esc(m.file_url)}" preload="metadata" muted></video><span class="play"><i data-lucide="play-circle"></i></span></button>`:`<button type="button" class="request-media-item" onclick="openRequestMedia('image','${encodeURIComponent(m.file_url)}')"><img src="${esc(m.file_url)}" alt="Foto del problema" loading="lazy"></button>`).join('')}</div></section>`;
}
function openRequestMedia(type,encodedUrl){
  const url=decodeURIComponent(encodedUrl);
  const modal=document.createElement('div');modal.className='media-modal';
  modal.innerHTML=`<div class="media-modal-inner"><button class="media-close" type="button" aria-label="Cerrar">×</button>${type==='video'?`<video src="${esc(url)}" controls autoplay playsinline></video>`:`<img src="${esc(url)}" alt="Evidencia del problema">`}</div>`;
  modal.onclick=e=>{if(e.target===modal||e.target.classList.contains('media-close'))modal.remove()};
  document.body.appendChild(modal);
}

async function accept(id,category){try{let p=partners.find(x=>(x.specialties||[]).includes(category)&&x.available)||partners.find(x=>x.available);if(!p)throw new Error('No hay socio demo disponible');await updateRequest(id,{status:'on_the_way',assigned_partner_id:p.id,accepted_at:new Date().toISOString()});alert('Servicio aceptado por '+p.name+'.');renderRequests(true)}catch(e){alert('No se pudo aceptar: '+e.message)}}
async function arrive(id){try{await updateRequest(id,{status:'arrived'});renderRequests(true)}catch(e){alert(e.message)}}
async function sendQuote(id,visit){try{const diagnosis=document.getElementById('diag-'+id).value.trim();const labor=Number(document.getElementById('labor-'+id).value||0);const materials=Number(document.getElementById('materials-'+id).value||0);if(labor<0||materials<0)throw new Error('Los importes no pueden ser negativos');await updateRequest(id,{status:'quoted',description:diagnosis||'Diagnóstico realizado por el profesional',labor_amount:labor,materials_amount:materials,total:Number(visit||0)+labor+materials});alert('Cotización enviada al cliente.');renderRequests(true)}catch(e){alert('No se pudo enviar la cotización: '+e.message)}}
async function startWork(id){try{await updateRequest(id,{status:'in_progress'});renderRequests(true)}catch(e){alert(e.message)}}async function completeWork(id){try{await updateRequest(id,{status:'completed',completed_at:new Date().toISOString()});alert('Servicio terminado. El cliente ya puede verlo.');renderRequests(true)}catch(e){alert(e.message)}}renderRequests(true);setInterval(()=>renderRequests(false),2500);
</script></body></html>

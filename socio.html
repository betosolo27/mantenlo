<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f2d55"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"><title>MANTENLO — Socio</title></head><body><header class="top"><div class="brand">MANT<span>ENLO</span></div><nav class="links"><a href="cliente.html">Cliente</a><a class="active" href="socio.html">Socio</a><a href="admin.html">Admin</a></nav></header><div class="wrap"><div class="phone"><div class="main"><div class="status">● DISPONIBLE</div><h1 class="title">MANTENLO SOCIO</h1><p class="subtitle">Solicitudes disponibles y tus ganancias.</p><div id="requests"></div><div class="option"><b>Esta semana</b><div class="price">$9,450</div><span class="pill">18 servicios · 96% aceptación · 4.9 ⭐</span></div><div class="option"><b>Tu nivel</b><h2>🥇 EXPERTO</h2><span class="pill">187 servicios realizados</span></div></div></div></div><script src="app.js"></script><script>
function renderRequests(){let db=seed(),el=document.getElementById('requests');let rs=db.requests.filter(r=>['Buscando socio','En camino','Diagnóstico','Autorizado'].includes(r.status));if(!rs.length){el.innerHTML='<div class="empty">No hay solicitudes pendientes. Cuando un cliente solicite un servicio compatible aparecerá aquí.</div>';return}el.innerHTML=rs.map(r=>`<div class="option"><div style="display:flex;justify-content:space-between"><b>🚨 ${esc(r.service)}</b><span class="badge">${r.id}</span></div><p><b>${esc(r.problem)}</b></p><span class="pill">${esc(r.zone)} · Visita estimada $199</span><div style="display:flex;gap:8px;margin-top:14px"><button class="primary" onclick="accept('${r.id}')">Aceptar</button><button class="secondary" onclick="reject('${r.id}')">Rechazar</button></div></div>`).join('')}
function accept(id){setRequestStatus(id,'En camino','Carlos Hernández',199);alert('Servicio aceptado. La dirección completa estaría disponible en la versión con backend.');renderRequests()}function reject(id){setRequestStatus(id,'Buscando socio');alert('Solicitud liberada para el siguiente socio.');renderRequests()}renderRequests();setInterval(renderRequests,3000);
</script></body></html>

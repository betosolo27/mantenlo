<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f2d55"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"><title>MANTENLO — Socio</title></head><body><header class="top"><div class="brand">MANT<span>ENLO</span></div><nav class="links"><a href="cliente.html">Cliente</a><a class="active" href="socio.html">Socio</a><a href="admin.html">Admin</a></nav></header><div class="wrap"><div class="phone"><div class="main"><div class="status">● CONECTADO A LA NUBE</div><h1 class="title">MANTENLO SOCIO</h1><p class="subtitle">Solicitudes reales del MVP.</p><div id="requests"><div class="empty">Cargando...</div></div></div></div></div><script src="app.js"></script><script>
let partners=[];async function renderRequests(){const el=document.getElementById('requests');try{if(!partners.length)partners=await getPartners();const rs=(await getRequests()).filter(r=>!['completed','cancelled'].includes(r.status));if(!rs.length){el.innerHTML='<div class="empty">No hay solicitudes pendientes. Crea una desde Cliente en otro dispositivo.</div>';return}el.innerHTML=rs.map(r=>card(r)).join('')}catch(e){el.innerHTML='<div class="empty">Error al conectar: '+esc(e.message)+'</div>'}}
function card(r){let action='';if(r.status==='searching')action=`<button class="primary" onclick="accept('${r.id}','${esc(r.category)}')">Aceptar servicio</button>`;else if(r.status==='on_the_way')action=`<button class="primary" onclick="arrive('${r.id}')">Ya llegué al domicilio</button>`;else if(r.status==='arrived')action=`<div class="quote-form"><label class="label">Diagnóstico</label><textarea class="textarea" id="diag-${r.id}" rows="2" placeholder="Ej. Fuga en conexión de tubería">${esc(r.description||'')}</textarea><label class="label">Mano de obra</label><input class="input" id="labor-${r.id}" type="number" inputmode="decimal" value="600"><label class="label">Materiales</label><input class="input" id="materials-${r.id}" type="number" inputmode="decimal" value="180"><button class="primary" onclick="sendQuote('${r.id}',${Number(r.visit_fee||199)})">Enviar cotización al cliente</button></div>`;else if(r.status==='quoted')action=`<div class="notice"><b>Cotización enviada.</b><br>Esperando autorización del cliente.</div>`;else if(r.status==='authorized')action=`<button class="primary" onclick="startWork('${r.id}')">Iniciar trabajo</button>`;else if(r.status==='in_progress')action=`<button class="primary" onclick="completeWork('${r.id}')">Marcar servicio terminado</button>`;return `<div class="option"><div style="display:flex;justify-content:space-between;gap:8px"><b>🚨 ${esc(r.category)}</b><span class="badge">${esc(statusLabel[r.status]||r.status)}</span></div><p><b>${esc(r.problem)}</b></p><span class="pill">${esc(r.address||'Zapopan')} · Visita ${money(r.visit_fee||199)}</span>${r.assigned_partner_id?`<p class="pill">Socio: ${esc(r.partners?.name||'asignado')}</p>`:''}${action}</div>`}
async function accept(id,category){try{let p=partners.find(x=>(x.specialties||[]).includes(category)&&x.available)||partners.find(x=>x.available);if(!p)throw new Error('No hay socio demo disponible');await updateRequest(id,{status:'on_the_way',assigned_partner_id:p.id,accepted_at:new Date().toISOString()});alert('Servicio aceptado por '+p.name+'.');renderRequests()}catch(e){alert('No se pudo aceptar: '+e.message)}}
async function arrive(id){try{await updateRequest(id,{status:'arrived'});renderRequests()}catch(e){alert(e.message)}}
async function sendQuote(id,visit){try{const diagnosis=document.getElementById('diag-'+id).value.trim();const labor=Number(document.getElementById('labor-'+id).value||0);const materials=Number(document.getElementById('materials-'+id).value||0);if(labor<0||materials<0)throw new Error('Los importes no pueden ser negativos');await updateRequest(id,{status:'quoted',description:diagnosis||'Diagnóstico realizado por el profesional',labor_amount:labor,materials_amount:materials,total:Number(visit||0)+labor+materials});alert('Cotización enviada al cliente.');renderRequests()}catch(e){alert('No se pudo enviar la cotización: '+e.message)}}
async function startWork(id){try{await updateRequest(id,{status:'in_progress'});renderRequests()}catch(e){alert(e.message)}}async function completeWork(id){try{await updateRequest(id,{status:'completed',completed_at:new Date().toISOString()});alert('Servicio terminado. El cliente ya puede verlo.');renderRequests()}catch(e){alert(e.message)}}renderRequests();setInterval(renderRequests,2500);
</script></body></html>

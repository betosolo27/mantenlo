<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f2d55"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"><title>MANTENLO — Socio</title></head><body><header class="top"><div class="brand">MANT<span>ENLO</span></div><nav class="links"><a href="cliente.html">Cliente</a><a class="active" href="socio.html">Socio</a><a href="admin.html">Admin</a></nav></header><div class="wrap"><div class="phone"><div class="main"><div class="status">● CONECTADO A LA NUBE</div><h1 class="title">MANTENLO SOCIO</h1><p class="subtitle">Solicitudes reales del MVP.</p><div id="requests"><div class="empty">Cargando...</div></div></div></div></div><script src="app.js"></script><script>
let partners=[];async function renderRequests(){const el=document.getElementById('requests');try{if(!partners.length)partners=await getPartners();const rs=(await getRequests()).filter(r=>r.status==='searching'||r.status==='assigned'||r.status==='on_the_way');if(!rs.length){el.innerHTML='<div class="empty">No hay solicitudes pendientes. Crea una desde Cliente en otro dispositivo.</div>';return}el.innerHTML=rs.map(r=>`<div class="option"><div style="display:flex;justify-content:space-between"><b>🚨 ${esc(r.category)}</b><span class="badge">${esc(statusLabel[r.status]||r.status)}</span></div><p><b>${esc(r.problem)}</b></p><span class="pill">${esc(r.address||'Zapopan')} · ${money(r.visit_fee||199)}</span>${r.status==='searching'?`<button class="primary" style="margin-top:14px" onclick="accept('${r.id}','${esc(r.category)}')">Aceptar servicio</button>`:`<p class="status">Asignado a ${esc(r.partners?.name||'un socio')}</p>`}</div>`).join('')}catch(e){el.innerHTML='<div class="empty">Error al conectar: '+esc(e.message)+'</div>'}}
async function accept(id,category){try{let p=partners.find(x=>(x.specialties||[]).includes(category)&&x.available)||partners.find(x=>x.available);if(!p)throw new Error('No hay socio demo disponible');await updateRequest(id,{status:'on_the_way',assigned_partner_id:p.id,accepted_at:new Date().toISOString()});alert('Servicio aceptado por '+p.name+'. Revisa el celular del cliente.');renderRequests()}catch(e){alert('No se pudo aceptar: '+e.message)}}renderRequests();setInterval(renderRequests,3000);
</script></body></html>

<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f2d55"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"><title>MANTENLO — Cliente</title></head><body><header class="top"><div class="brand">MANT<span>ENLO</span></div><nav class="links"><a class="active" href="cliente.html">Cliente</a><a href="socio.html">Socio</a><a href="admin.html">Admin</a></nav></header><div class="wrap"><div id="app"></div></div><script src="app.js"></script><script>
let step='home',service='',requestId=null,pollTimer=null;
function render(){let app=document.getElementById('app'),c='';if(step==='home')c=`<div class="phone"><div class="main"><div class="status">Servicio bajo demanda</div><h1 class="title">¿Qué necesitas resolver?</h1><p class="subtitle">Encuentra un profesional disponible cerca de ti.</p><div class="grid">${serviceOptions()}</div></div></div>`;
if(step==='service')c=`<div class="phone"><div class="main"><button class="back" onclick="go('home')">← Regresar</button><h1 class="title">${esc(service)}</h1><p class="subtitle">Selecciona el problema.</p>${['Fuga de agua','Llave o grifo','WC','Drenaje','Tubería','Otro'].map((x,i)=>`<div class="option ${i===0?'selected':''}" onclick="selectProblem('${x}',this)">${x}</div>`).join('')}<button class="primary" onclick="go('detail')">Continuar</button></div></div>`;
if(step==='detail')c=`<div class="phone"><div class="main"><button class="back" onclick="go('service')">← Regresar</button><h1 class="title">Describe el problema</h1><textarea id="problem" class="textarea" rows="4">${esc(window.problem||'Hay una fuga de agua debajo del lavabo.')}</textarea><button class="primary" onclick="saveProblemAndGo()">Continuar</button></div></div>`;
if(step==='urgency')c=`<div class="phone"><div class="main"><button class="back" onclick="go('detail')">← Regresar</button><h1 class="title">¿Qué tan urgente es?</h1><div class="option selected" onclick="go('location')">🔴 <b>Lo necesito ahora</b><br><span class="pill">Atención inmediata</span></div><div class="option" onclick="go('location')">🟠 <b>Hoy</b></div><div class="option" onclick="go('location')">🟢 <b>Quiero programarlo</b></div></div></div>`;
if(step==='location')c=`<div class="phone"><div class="main"><button class="back" onclick="go('urgency')">← Regresar</button><h1 class="title">Confirma tu ubicación</h1><div class="map"><div class="pin a">📍</div></div><div class="option"><b>Ubicación de demostración</b><br><span class="pill">Zapopan, Jalisco</span></div><button class="primary" onclick="createAndSearch()">Buscar profesional</button></div></div>`;
if(step==='search')c=`<div class="phone"><div class="main" style="text-align:center;padding-top:90px"><div style="font-size:60px">🔎</div><h1 class="title">Buscando profesional...</h1><p class="subtitle">Tu solicitud ya está guardada en la nube.</p><div class="status">Esperando que un socio la acepte</div><p class="pill">Puedes abrir Socio en otro celular.</p></div></div>`;
if(step==='found')c=`<div class="phone"><div class="main"><div class="status">¡Profesional encontrado!</div><h1 class="title" id="foundName">Socio asignado</h1><div class="tech"><div class="avatar">✓</div><div><b id="techName">MANTENLO</b><div class="stars">★ <span id="techRating">4.9</span></div></div></div><div class="option"><span class="pill">Visita</span><div class="price">$199</div></div><button class="primary" onclick="go('tracking')">Seguir a mi profesional</button></div></div>`;
if(step==='tracking')c=`<div class="phone"><div class="main"><div class="status">Profesional en camino</div><h1 class="title">Seguimiento</h1><div class="map"><div class="pin a">📍</div><div class="pin b">🚗</div></div><p class="subtitle">Esta pantalla ya está conectada al servicio real. GPS en vivo será la siguiente fase.</p><button class="primary" onclick="finishDemo()">Simular servicio terminado</button></div></div>`;
if(step==='done')c=`<div class="phone"><div class="main" style="text-align:center"><div style="font-size:60px">✅</div><h1 class="title">¡Servicio terminado!</h1><p class="subtitle">La solicitud quedó actualizada en Supabase.</p><button class="primary" onclick="go('home')">Finalizar</button></div></div>`;app.innerHTML=c}
function chooseService(s){service=s;window.problem=s==='Plomería'?'Fuga de agua':'Problema de '+s;go('service')}function selectProblem(x,el){document.querySelectorAll('.option').forEach(e=>e.classList.remove('selected'));el.classList.add('selected');window.problem=x}function saveProblemAndGo(){window.problem=document.getElementById('problem').value;go('urgency')}function go(s){step=s;render()}
async function createAndSearch(){try{const r=await newRequest(service,window.problem);requestId=r.id;go('search');startPolling()}catch(e){alert('No se pudo crear la solicitud: '+e.message)}}
function startPolling(){clearInterval(pollTimer);pollTimer=setInterval(checkStatus,2500);checkStatus()}
async function checkStatus(){if(!requestId)return;try{const r=await getRequest(requestId);if(r&&r.assigned_partner_id&&r.status!=='searching'){clearInterval(pollTimer);step='found';render();const n=r.partners?.name||'Socio MANTENLO';document.getElementById('foundName').textContent=n+' está disponible';document.getElementById('techName').textContent=n;document.getElementById('techRating').textContent=r.partners?.rating||'5.0'}}catch(e){console.error(e)}}
async function finishDemo(){try{await updateRequest(requestId,{status:'completed',completed_at:new Date().toISOString(),labor_amount:600,materials_amount:180,total:780});go('done')}catch(e){alert(e.message)}}render();
</script></body></html>

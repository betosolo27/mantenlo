<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f2d55"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css?v=20260921-rejectfix3"><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><title>MANTENLO — Cliente</title>
<style>
.partner-profile{margin:18px 0 16px;padding:18px;border:1px solid #e3eaf1;border-radius:24px;background:#fff;box-shadow:0 12px 30px rgba(15,45,85,.08)}
.partner-head{display:flex;gap:15px;align-items:center}
.partner-photo{width:82px;height:82px;flex:0 0 82px;border-radius:22px;object-fit:cover;background:#eef4f8;border:3px solid #fff;box-shadow:0 5px 18px rgba(15,45,85,.13)}
.partner-photo-fallback{width:82px;height:82px;flex:0 0 82px;border-radius:22px;display:grid;place-items:center;background:#edf6ff;color:#0f2d55}
.partner-photo-fallback svg{width:34px;height:34px}
.partner-name-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}

.verified-badge{display:inline-flex;align-items:center;gap:4px;padding:5px 8px;border-radius:999px;background:#e9f9f3;color:#08795b;font-size:10px;font-weight:800}

<style>

.media-upload-head{display:flex;gap:11px;align-items:flex-start;margin-bottom:13px}

.media-upload-head b{display:block;color:#15324f;font-size:14px}
.media-upload-head span{display:block;color:#778497;font-size:11px;margin-top:3px;line-height:1.35}
.media-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.media-action{border:1px solid #dce5ed;background:#fff;border-radius:15px;padding:12px 8px;font:inherit;font-size:11px;font-weight:750;color:#183650;display:flex;gap:7px;align-items:center;justify-content:center;cursor:pointer}
.media-action svg{width:18px;height:18px;color:#147ac5}
.media-preview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}

.media-remove{position:absolute;right:5px;top:5px;width:24px;height:24px;border:0;border-radius:50%;background:rgba(8,30,52,.78);color:white;display:grid;place-items:center;cursor:pointer}
.media-remove svg{width:13px;height:13px}
.media-count{font-size:10px;color:#7a8797;margin-top:9px;text-align:center}
.upload-progress{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:#eef8ff;color:#176a9f;font-size:11px;font-weight:700;text-align:center}
</style>

<style>
.address-card{margin:16px 0;padding:17px;border:1px solid #e3eaf1;border-radius:21px;background:#fff;box-shadow:0 8px 24px rgba(15,45,85,.06)}

.address-field .input,.address-field .textarea{margin:0;width:100%;box-sizing:border-box}
.address-help{display:flex;gap:7px;align-items:flex-start;color:#788698;font-size:10px;line-height:1.4;margin:4px 2px 0}

@media(max-width:380px){.address-grid{grid-template-columns:1fr}}

<style>
.chat-card{margin:16px 0;padding:15px;border:1px solid #e2e9ef;border-radius:20px;background:#fff}.chat-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.chat-head b{display:flex;gap:7px;align-items:center;color:#173650;font-size:13px}.chat-head svg{width:18px;color:#147ac5}.chat-messages{max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:8px}.chat-row{display:flex}.chat-row.mine{justify-content:flex-end}.chat-bubble{max-width:82%;padding:9px 11px;border-radius:15px;background:#f0f4f7;color:#17324c;font-size:12px}.chat-row.mine .chat-bubble{background:#0f2d55;color:#fff}.chat-meta{font-size:9px;opacity:.68;margin-top:4px}.chat-empty{padding:12px;background:#f7f9fb;border-radius:12px;text-align:center;color:#7a8797;font-size:11px}.chat-compose{display:grid;grid-template-columns:1fr 43px;gap:8px;margin-top:10px}.chat-input{min-width:0;border:1px solid #dce5ed;border-radius:14px;padding:11px;font:inherit;font-size:12px}.chat-send{border:0;border-radius:14px;background:#ff7417;color:#fff;display:grid;place-items:center}.chat-send svg{width:18px}
</style></head><body><header class="top"><div class="brand">MANT<span>ENLO</span></div><nav class="links"><a class="active" href="cliente.html">Cliente</a><a href="socio.html">Socio</a><a href="admin.html">Admin</a></nav></header><div class="wrap"><div id="app"></div></div><script src="app.js?v=20260923-night1"></script><script>
let step='home',service='',requestId=null,pollTimer=null,proposalTimer=null,currentRequest=null,selectedRating=0,ratingSending=false,ratingCommentDraft='',serviceTiming='now',scheduledDate='',timeFrom='',timeTo='',selectedSlot='',problemMedia=[],addressData={street:'',exterior_number:'',interior_number:'',neighborhood:'',postal_code:'',address_references:''},chatMessages=[];
const problemsByService={
'Plomería':['Fuga de agua','WC / taza','Lavabo o fregadero','Tubería tapada','Baja presión','Otro problema'],
'Electricidad':['Apagón parcial','Contacto sin corriente','Corto / chispas','Interruptor o apagador','Instalación eléctrica','Otro problema'],
'Boiler':['No enciende','No calienta','Fuga de agua','Olor o fuga de gas','Piloto se apaga','Mantenimiento','Otro problema'],
'Cerrajería':['Me quedé fuera','Llave rota o atorada','Cambiar cerradura','Reparar cerradura','Duplicado / cambio de llave','Otro problema'],
'Aire acondicionado':['No enfría','No enciende','Tira agua','Hace ruido','Instalación','Mantenimiento','Otro problema']};
function serviceIcon(s){const m={'Plomería':'wrench','Electricidad':'zap','Boiler':'flame','Cerrajería':'key-round','Aire acondicionado':'snowflake','Otro':'circle-plus'};return `<i data-lucide="${m[s]||'wrench'}"></i>`}
function serviceProblems(){return problemsByService[service]||[]}
function detailExample(){const x={Plomería:'Ej. El WC pierde agua desde esta mañana.',Electricidad:'Ej. Los contactos de la cocina dejaron de funcionar.',Boiler:'Ej. El boiler enciende pero el agua no calienta.',Cerrajería:'Ej. La llave se rompió dentro de la cerradura.','Aire acondicionado':'Ej. El equipo enciende pero no enfría.',Otro:'Describe con el mayor detalle posible qué necesitas resolver.'};return x[service]||''}

async function hydrateAssignedPartner(r){
  if(!r?.assigned_partner_id)return r;
  try{
    const list=typeof getPartners==='function'?await getPartners():[];
    const full=(list||[]).find(p=>String(p.id)===String(r.assigned_partner_id));
    if(full)r.partners={...(r.partners||{}),...full};
  }catch(e){console.warn('No se pudo cargar el perfil completo del socio',e)}
  return r;
}
function partnerProfileMarkup(r){
  const p=r.partners||{},n=p.name||'Socio MANTENLO';
  const photo=p.photo_url?`<img class="partner-photo" src="${esc(p.photo_url)}" alt="Foto de ${esc(n)}" onerror="this.outerHTML='<div class=&quot;partner-photo-fallback&quot;><i data-lucide=&quot;user-round&quot;></i></div>'">`:`<div class="partner-photo-fallback"><i data-lucide="user-round"></i></div>`;
  const exp=Number(p.years_experience||0),jobs=Number(p.services_completed||0);
  return `<section class="partner-profile">
    <div class="partner-head">${photo}<div>
      <div class="partner-name-row"><h2>${esc(n)}</h2>${p.verified?`<span class="verified-badge"><i data-lucide="badge-check"></i> Verificado</span>`:''}</div>
      <div class="partner-rating"><i class="star-gold" data-lucide="star"></i><b>${esc(p.rating||'5.0')}</b><span>Calificación</span></div>
    </div></div>
    <div class="partner-stats">
      <div class="partner-stat"><b>${exp}</b><span>${exp===1?'año':'años'} de experiencia</span></div>
      <div class="partner-stat"><b>${jobs}</b><span>servicios realizados</span></div>
    </div>
    ${p.specialty?`<div class="partner-detail"><i data-lucide="wrench"></i><div><b>Especialidad</b><span>${esc(p.specialty)}</span></div></div>`:''}
    ${p.certifications?`<div class="partner-detail"><i data-lucide="award"></i><div><b>Certificación</b><span>${esc(p.certifications)}</span></div></div>`:''}
  </section>`;
}

function chatTime(v){try{return new Date(v).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
let clientChatDraft='';
function clientChatMarkup(){if(!requestId||!currentRequest?.assigned_partner_id)return '';const rows=chatMessages||[];return `<section class="chat-card"><div class="chat-head"><b><i data-lucide="message-circle"></i> Mensajes con tu profesional</b><span class="pill">${rows.length}</span></div><div class="chat-messages" id="clientChatMessages">${rows.length?rows.map(m=>`<div class="chat-row ${m.sender_type==='customer'?'mine':''}"><div class="chat-bubble">${esc(m.message)}<div class="chat-meta">${m.sender_type==='customer'?'Tú':'Profesional'} · ${chatTime(m.created_at)}</div></div></div>`).join(''):'<div class="chat-empty">Todavía no hay mensajes.</div>'}</div><div class="chat-compose"><input id="clientChatInput" class="chat-input" maxlength="500" placeholder="Escribe un mensaje..." value="${esc(clientChatDraft)}" oninput="clientChatDraft=this.value"><button class="chat-send" onclick="sendClientChat()"><i data-lucide="send"></i></button></div></section>`}
function scrollClientChatToBottom(){requestAnimationFrame(()=>{const box=document.getElementById('clientChatMessages');if(box)box.scrollTop=box.scrollHeight})}
async function loadClientChat(){if(requestId&&currentRequest?.assigned_partner_id){try{chatMessages=await getServiceMessages(requestId)||[]}catch(e){console.warn(e)}}}
async function sendClientChat(){const i=document.getElementById('clientChatInput'),m=(i?.value||'').trim();if(!m)return;try{await sendServiceMessage(requestId,'customer',m);clientChatDraft='';if(i)i.value='';await loadClientChat();render();scrollClientChatToBottom()}catch(e){alert('No se pudo enviar: '+e.message)}}
function renderPreservingClientChat(){
  const input=document.getElementById('clientChatInput');
  const focused=document.activeElement===input;
  if(input)clientChatDraft=input.value;
  render();
  if(focused){
    const next=document.getElementById('clientChatInput');
    if(next){next.focus();next.setSelectionRange(next.value.length,next.value.length)}
  }
}
function render(){let app=document.getElementById('app'),c='';if(step==='home')c=`<div class="phone home-screen"><div class="main"><section class="hero"><div class="status"><span class="status-dot"></span>Servicio bajo demanda</div><h1 class="title">¿Qué necesitas<br>resolver?</h1><p class="subtitle">Encuentra un profesional verificado disponible cerca de ti.</p></section><div class="grid service-grid">${serviceOptions()}</div><section class="trust-card house-banner"><div class="house-art"><img src="casa-mantenlo.png" alt=""></div><div class="house-copy"><b>Tu hogar en buenas manos</b><span>Profesionales verificados, rápidos y de confianza.</span></div></section><div class="trust-row"><div><i data-lucide="badge-check"></i><b>Verificados</b><span>Profesionales<br>de confianza</span></div><div><i data-lucide="clock-3"></i><b>Atención rápida</b><span>Cuando lo<br>necesites</span></div><div><i data-lucide="shield-check"></i><b>Servicio seguro</b><span>Tu tranquilidad<br>primero</span></div></div></div></div>`;
if(step==='service'){const probs=serviceProblems();c=`<div class="phone"><div class="main"><button class="back" onclick="go('home')"><i data-lucide="arrow-left"></i> Regresar</button><div class="screen-heading"><div class="heading-icon service-${slugService(service)}">${serviceIcon(service)}</div><div><h1 class="title">${esc(service)}</h1><p class="subtitle">Selecciona el problema.</p></div></div><div class="option-list">${probs.map((x,i)=>`<div class="option choice ${window.problem===x?'selected':''}" onclick="selectProblem(decodeURIComponent('${encodeURIComponent(x)}'),this)"><span>${esc(x)}</span><i data-lucide="chevron-right"></i></div>`).join('')}</div><button class="primary" onclick="continueFromProblem()">Continuar <i data-lucide="arrow-right"></i></button></div></div>`;}
if(step==='detail')c=`<div class="phone"><div class="main"><button class="back" onclick="${service==='Otro'?"go('home')":"go('service')"}"><i data-lucide="arrow-left"></i> Regresar</button><h1 class="title">Cuéntanos qué está pasando</h1><p class="subtitle">${service==='Otro'?'Describe el servicio que necesitas.':`Seleccionaste: <b>${esc(window.problem||'')}</b>`}</p><textarea id="problem" class="textarea" rows="4" placeholder="${esc(detailExample())}">${service==='Otro'?'':esc(window.problem||'')}</textarea>
<section class="media-upload">
  <div class="media-upload-head"><i data-lucide="images"></i><div><b>Agregar fotos o video</b><span>Opcional · hasta 5 fotos y 1 video corto. Ayuda al profesional a entender mejor el problema.</span></div></div>
  <div class="media-actions">
    <button type="button" class="media-action" onclick="document.getElementById('problemPhotos').click()"><i data-lucide="camera"></i> Agregar fotos</button><button type="button" class="media-action" onclick="document.getElementById('problemCamera').click()"><i data-lucide="camera"></i> Tomar foto</button>
    <button type="button" class="media-action" onclick="document.getElementById('problemVideo').click()"><i data-lucide="video"></i> Agregar video</button>
  </div>
  <input id="problemPhotos" type="file" accept="image/*" multiple hidden onchange="addProblemPhotos(this.files)">
<input id="problemCamera" type="file" accept="image/*" capture="environment" hidden onchange="addProblemPhotos(this.files);this.value=''">
  <input id="problemVideo" type="file" accept="video/*" hidden onchange="addProblemVideo(this.files)">
  ${mediaPreviewMarkup()}
</section>
<button class="primary" onclick="saveProblemAndGo()">Continuar</button></div></div>`;
if(step==='urgency')c=`<div class="phone"><div class="main"><button class="back" onclick="go('detail')"><i data-lucide="arrow-left"></i> Regresar</button><h1 class="title">¿Cuándo necesitas el servicio?</h1><div class="option" onclick="chooseTiming('now')">🔴 <b>Lo necesito ahora</b><br><span class="pill">${isNightUrgent()?'Servicio nocturno · visita $399':'Atención inmediata · visita $199'}</span></div><div class="option" onclick="chooseTiming('today')">🟠 <b>Hoy, sin urgencia</b><br><span class="pill">Elige un rango de horario</span></div><div class="option" onclick="chooseTiming('scheduled')">🟢 <b>Quiero programarlo</b><br><span class="pill">Elige fecha y horario</span></div></div></div>`;
if(step==='schedule'){const today=new Date();const minDate=localDate(today);const dateValue=serviceTiming==='today'?minDate:(scheduledDate||minDate);const slots=availableSlots(dateValue);c=`<div class="phone"><div class="main"><button class="back" onclick="go('urgency')"><i data-lucide="arrow-left"></i> Regresar</button><div class="screen-heading compact"><div class="heading-icon"><i data-lucide="calendar-days"></i></div><div><h1 class="title">${serviceTiming==='today'?'Elige tu horario':'Programa tu servicio'}</h1><p class="subtitle">Selecciona una fecha y un horario disponible.</p></div></div>${serviceTiming==='scheduled'?`<label class="label">Fecha</label><div class="input-wrap"><i data-lucide="calendar"></i><input id="scheduledDate" class="input" type="date" min="${minDate}" value="${esc(dateValue)}" onchange="scheduledDate=this.value;selectedSlot='';render()"></div>`:''}<div class="slot-heading"><b><i data-lucide="clock-3"></i> Horarios disponibles</b><span>9:00 a.m. a 9:00 p.m.</span></div><div class="slot-grid">${slots.length?slots.map(s=>`<button type="button" class="option slot-option ${selectedSlot===s.from+'|'+s.to?'selected':''}" onclick="selectSlot('${s.from}','${s.to}',this)"><b>${formatHour(s.from)} – ${formatHour(s.to)}</b>${selectedSlot===s.from+'|'+s.to?'<span class="slot-check">✓</span>':''}</button>`).join(''):'<div class="option empty-slot"><b>No quedan horarios disponibles para este día.</b><br><span class="pill">Selecciona otra fecha.</span></div>'}</div><button class="primary" onclick="saveSchedule()">Continuar <i data-lucide="arrow-right"></i></button><p class="helper"><i data-lucide="calendar-clock"></i> Puedes cambiar la fecha o el horario más adelante.</p></div></div>`;}
if(step==='location')c=`<div class="phone"><div class="main"><button class="back" onclick="go('urgency')"><i data-lucide="arrow-left"></i> Regresar</button><h1 class="title">Confirma tu ubicación</h1><p class="subtitle">El mapa ayuda a ubicarte, pero necesitamos tu domicilio escrito para que el profesional llegue sin problema.</p><div class="map"><div class="pin a">📍</div></div><div class="option"><b>Ubicación en mapa</b><br><span class="pill">Zapopan, Jalisco</span></div><section class="address-card"><div class="address-title"><i data-lucide="map-pinned"></i><b>Domicilio del servicio</b></div><div class="address-grid"><div class="address-field full"><label>Calle</label><input id="street" class="input" autocomplete="street-address" placeholder="Ej. Av. Patria" value="${esc(addressData.street)}"></div><div class="address-field"><label>Número exterior</label><input id="exterior_number" class="input" inputmode="text" placeholder="1234" value="${esc(addressData.exterior_number)}"></div><div class="address-field"><label>Número interior <span style="font-weight:500">(opcional)</span></label><input id="interior_number" class="input" placeholder="Ej. 4B" value="${esc(addressData.interior_number)}"></div><div class="address-field full"><label>Colonia</label><input id="neighborhood" class="input" placeholder="Ej. Jardines del Valle" value="${esc(addressData.neighborhood)}"></div><div class="address-field"><label>Código postal</label><input id="postal_code" class="input" inputmode="numeric" maxlength="5" placeholder="45138" value="${esc(addressData.postal_code)}"></div><div class="address-field full"><label>Referencias <span style="font-weight:500">(opcional)</span></label><textarea id="address_references" class="textarea" rows="3" placeholder="Ej. Casa blanca con portón negro, frente al parque.">${esc(addressData.address_references)}</textarea></div></div><div class="address-help"><i data-lucide="info"></i><span>Las referencias ayudan al profesional cuando el punto del mapa no es exacto.</span></div></section>${serviceTiming==='now'?`<div class="visit-card"><span>${isNightUrgent()?'Visita $199 + recargo nocturno $200':'Cargo por visita'}</span><div class="price">${money(urgentVisitTotal())}</div></div>`:''}<button class="primary" onclick="validateAddressAndSearch()">Buscar profesional <i data-lucide="search"></i></button></div></div>`;

function mediaPreviewMarkup(){

  return `<div class="media-preview">${problemMedia.map((m,i)=>`<div class="media-thumb">${m.kind==='image'?`<img src="${m.preview}" alt="Foto del problema">`:`<div class="video-placeholder"><i data-lucide="play-circle"></i></div>`}<button type="button" class="media-remove" onclick="removeProblemMedia(${i})" aria-label="Eliminar"><i data-lucide="x"></i></button></div>`).join('')}</div><div class="media-count">${problemMedia.filter(x=>x.kind==='image').length}/5 fotos · ${problemMedia.some(x=>x.kind==='video')?'1/1':'0/1'} video</div>`;
}
function addProblemPhotos(files){
  const existing=problemMedia.filter(x=>x.kind==='image').length,room=5-existing;
  const picked=Array.from(files||[]).filter(f=>f.type.startsWith('image/')).slice(0,room);
  if(!room){alert('Puedes agregar hasta 5 fotos.');return}
  if(Array.from(files||[]).length>room)alert('Solo se agregarán las fotos disponibles hasta completar el máximo de 5.');
  picked.forEach(file=>problemMedia.push({kind:'image',file,preview:URL.createObjectURL(file)}));render();
}
function addProblemVideo(files){
  const file=Array.from(files||[]).find(f=>f.type.startsWith('video/'));
  if(!file)return;
  if(problemMedia.some(x=>x.kind==='video')){alert('Puedes agregar solamente 1 video. Elimina el actual para cambiarlo.');return}
  problemMedia.push({kind:'video',file,preview:''});render();
}
function removeProblemMedia(i){
  const m=problemMedia[i];if(m?.preview)URL.revokeObjectURL(m.preview);
  problemMedia.splice(i,1);render();
}
async function uploadPendingProblemMedia(rid){
  for(const m of problemMedia){
    const url=await uploadServiceMedia(rid,m.file);
    await saveServiceMedia(rid,m.file,url);

}

function localDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function isNightUrgent(){const h=new Date().getHours();return serviceTiming==='now'&&(h>=21||h<9)}
function urgentVisitTotal(){return 199+(isNightUrgent()?200:0)}
function availableSlots(dateStr){
  const slots=[];for(let h=9;h<21;h+=2)slots.push({from:String(h).padStart(2,'0')+':00',to:String(Math.min(h+2,21)).padStart(2,'0')+':00'});
  const now=new Date();
  if(dateStr!==localDate(now))return slots;
  const mins=now.getHours()*60+now.getMinutes();
  if(mins<9*60)return slots;
  if(mins>=21*60)return [];
  const future=slots.filter(s=>Number(s.from.slice(0,2))*60>mins);
  const currentFrom=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  return [{from:currentFrom,to:'21:00',flex:true},...future.filter(s=>Number(s.from.slice(0,2))*60>mins+30)];
}
function formatHour(t){let h=Number(t.slice(0,2)),m=t.slice(3),ap=h>=12?'p.m.':'a.m.';let hh=h%12||12;return `${hh}:${m} ${ap}`}

function saveSchedule(){if(serviceTiming==='scheduled'){const d=document.getElementById('scheduledDate')?.value;if(!d){alert('Selecciona la fecha del servicio.');return}scheduledDate=d}else scheduledDate=localDate(new Date());if(!timeFrom||!timeTo||!selectedSlot){alert('Selecciona uno de los horarios disponibles.');return}go('location')}function chooseService(s){service=s;if(s==='Otro'){window.problem='';go('detail');return}const probs=serviceProblems();window.problem=probs[0]||'';go('service')}function selectProblem(x,el){document.querySelectorAll('.option').forEach(e=>e.classList.remove('selected'));el.classList.add('selected');window.problem=x}function continueFromProblem(){if(service==='Boiler'&&window.problem==='Olor o fuga de gas'){alert('⚠️ Si percibes olor a gas: cierra la llave de gas si puedes hacerlo con seguridad, ventila el área, evita encender o apagar interruptores y aléjate si el olor es intenso. Si existe riesgo inmediato, contacta a los servicios de emergencia o a tu proveedor de gas.');}go('detail')}function saveProblemAndGo(){const v=document.getElementById('problem').value.trim();if(!v){alert('Describe brevemente qué necesitas resolver.');return}window.problem=v;go('urgency')}function go(s){step=s;render()}

async function createAndSearch(){try{const a=addressData.street?addressData:collectAddress();let r=await newRequest(service,window.problem);const night=isNightUrgent();const addressPatch={street:a.street,exterior_number:a.exterior_number,interior_number:a.interior_number||null,neighborhood:a.neighborhood,postal_code:a.postal_code,address_references:a.address_references||null,address:formattedAddress(a),night_surcharge:night?200:0,total:night?399:199};if(serviceTiming!=='now'){r=await updateRequest(r.id,{...addressPatch,service_timing:serviceTiming,scheduled_date:scheduledDate,time_from:timeFrom,time_to:timeTo})}else{r=await updateRequest(r.id,{...addressPatch,service_timing:'now',scheduled_date:null,time_from:null,time_to:null})}requestId=r.id;localStorage.setItem('mantenlo_active_request_id',requestId);currentRequest=r;if(problemMedia.length){const btn=document.querySelector('.primary');if(btn){btn.disabled=true;btn.textContent='Subiendo fotos y video...'}await uploadPendingProblemMedia(requestId)}go('search');startPolling()}catch(e){alert('No se pudo crear la solicitud o subir los archivos: '+e.message)}}
function startPolling(){clearInterval(pollTimer);pollTimer=setInterval(checkStatus,2000);checkStatus()}

function proposalSecondsLeft(){
  if(!currentRequest?.accepted_at)return 60;
  return Math.max(0,60-Math.floor((Date.now()-new Date(currentRequest.accepted_at).getTime())/1000));
}
function stopProposalTimer(){if(typeof proposalTimer!=='undefined'&&proposalTimer){clearInterval(proposalTimer);proposalTimer=null}}
function startProposalTimer(){
  stopProposalTimer();
  const tick=async()=>{
    if(step!=='proposal'||!currentRequest){stopProposalTimer();return}
    const left=proposalSecondsLeft();
    const el=document.getElementById('proposalCountdown');
    if(el)el.textContent=`00:${String(left).padStart(2,'0')}`;
    if(left<=0){
      stopProposalTimer();
      try{await confirmProposedPartner(true)}catch(e){console.error(e)}
    }
  };
  tick();proposalTimer=setInterval(tick,1000);
}
async function confirmProposedPartner(auto=false){
  if(!requestId||!currentRequest)return;
  try{
    const latest=await getRequest(requestId);
    if(!latest||String(latest.status||'').toLowerCase()!=='partner_proposed')return;
    currentRequest=await updateRequest(requestId,{status:'confirmed',confirmed_at:new Date().toISOString()});
    step='found';await loadClientChat();render();scrollClientChatToBottom();startPolling();
  }catch(e){if(!auto)alert('No se pudo confirmar al profesional: '+e.message);throw e}
}
async function rejectProposedPartner(){
  if(!requestId||!currentRequest)return;
  const rejected=currentRequest.assigned_partner_id;
  if(!rejected)return;
  try{
    stopProposalTimer();
    const prev=Array.isArray(currentRequest.rejected_partner_ids)?currentRequest.rejected_partner_ids:[];
    const rejectedIds=[...new Set([...prev,rejected])];
    currentRequest=await updateRequest(requestId,{
      status:'searching',
      assigned_partner_id:null,
      accepted_at:null,
      confirmed_at:null,
      rejected_partner_ids:rejectedIds
    });
    step='search';render();startPolling();
  }catch(e){alert('No se pudo rechazar al profesional: '+e.message)}
}
function openCancellation(){
  if(!currentRequest)return;
  const st=String(currentRequest.status||'').toLowerCase();
  if(!['confirmed','on_the_way','arrived'].includes(st))return;
  clearInterval(pollTimer);pollTimer=null;
  step='cancel';render();
}
function closeCancellation(){
  if(!currentRequest)return;
  const st=String(currentRequest.status||'').toLowerCase();
  step=st==='confirmed'?'found':'tracking';
  render();
  startPolling();
}
async function confirmCancellation(){
  if(!requestId||!currentRequest)return;
  const reason=(document.getElementById('cancelReason')?.value||'').trim();
  if(!reason){alert('Selecciona un motivo de cancelación.');return}
  try{
    const latest=await getRequest(requestId);
    if(!latest)return;
    const st=String(latest.status||'').toLowerCase();
    if(!['confirmed','on_the_way','arrived'].includes(st)){
      currentRequest=latest;alert('El estado del servicio cambió. Revisa la información actual.');await checkStatus();return;
    }
    const fee=['on_the_way','arrived'].includes(st)?Number(latest.visit_fee||199):0;
    currentRequest=await updateRequest(requestId,{
      status:'cancelled',
      cancelled_at:new Date().toISOString(),
      cancelled_by:'customer',
      cancellation_reason:reason,
      cancellation_fee:fee,
      cancellation_from_status:st,
      total:fee
    });
    clearInterval(pollTimer);pollTimer=null;stopProposalTimer();
    step='cancelled';render();
  }catch(e){alert('No se pudo cancelar el servicio: '+e.message)}
}
async function checkStatus(){if(!requestId||step==='cancel')return;try{const r=await getRequest(requestId);if(!r)return;currentRequest=r;const st=String(r.status||'').trim().toLowerCase();if(st==='cancelled'){stopProposalTimer();clearInterval(pollTimer);pollTimer=null;step='cancelled'}else if(st==='completed'){stopProposalTimer();clearInterval(pollTimer);pollTimer=null;step='done'}else if(st==='quote_rejected'){stopProposalTimer();clearInterval(pollTimer);pollTimer=null;step='rejected'}else if(st==='partner_proposed'){step='proposal';currentRequest=await hydrateAssignedPartner(currentRequest)}else if(st==='quoted'){step='quote'}else if(['authorized','in_progress'].includes(st)){step='authorized'}else if(st==='arrived'){if(step!=='found')step='tracking'}else if(r.assigned_partner_id&&st!=='searching'){if(!['tracking','quote','authorized','rejected'].includes(step))step='found'}else step='search';if(step==='found')currentRequest=await hydrateAssignedPartner(currentRequest);if(currentRequest?.assigned_partner_id&&st!=='partner_proposed')await loadClientChat();renderPreservingClientChat();if(step==='proposal')startProposalTimer();else stopProposalTimer();if(step==='found')scrollClientChatToBottom()}catch(e){console.error(e)}}

async function submitRating(){if(!selectedRating){alert('Selecciona de 1 a 5 estrellas.');return}if(!requestId||!currentRequest?.assigned_partner_id){alert('No encontramos el servicio o el socio asignado.');return}const comment=ratingCommentDraft;ratingSending=true;render();try{await createRating(requestId,currentRequest.assigned_partner_id,selectedRating,comment);await refreshPartnerRating(currentRequest.assigned_partner_id);alert('¡Gracias! Tu calificación quedó guardada.');resetApp()}catch(e){ratingSending=false;render();const el=document.getElementById('ratingComment');if(el)el.value=comment;alert('No se pudo guardar la calificación: '+e.message)}}
function resetApp(){stopProposalTimer();clearInterval(pollTimer);localStorage.removeItem('mantenlo_active_request_id');requestId=null;currentRequest=null;service='';window.problem='';selectedRating=0;ratingSending=false;ratingCommentDraft='';serviceTiming='now';scheduledDate='';timeFrom='';timeTo='';selectedSlot='';problemMedia.forEach(m=>{if(m.preview)URL.revokeObjectURL(m.preview)});problemMedia=[];addressData={street:'',exterior_number:'',interior_number:'',neighborhood:'',postal_code:'',address_references:''};step='home';render()}
async function recoverActiveRequest(){
  try{
    const saved=localStorage.getItem('mantenlo_active_request_id');
    if(!saved){render();return}
    const r=await getRequest(saved);
    if(!r){localStorage.removeItem('mantenlo_active_request_id');render();return}
    requestId=r.id;
    currentRequest=r;
    const st=String(r.status||'').trim().toLowerCase();
    if(st==='completed') step='done';
    else if(st==='quote_rejected') step='rejected';
    else if(st==='partner_proposed'){step='proposal';currentRequest=await hydrateAssignedPartner(currentRequest)}
    else if(st==='quoted') step='quote';
    else if(['authorized','in_progress'].includes(st)) step='authorized';
    else if(st==='arrived') step='tracking';
    else if(r.assigned_partner_id && st!=='searching') step='found';
    else if(st==='cancelled') step='cancelled';
    else step='search';
    if(step==='found')currentRequest=await hydrateAssignedPartner(currentRequest);
    if(currentRequest?.assigned_partner_id)await loadClientChat();
    render();
    if(step==='found')scrollClientChatToBottom();
    if(!['completed','quote_rejected','cancelled'].includes(st)) startPolling();
  }catch(e){
    console.error('No se pudo recuperar el servicio activo',e);
    render();
  }
}
recoverActiveRequest();
</script>

</script>

<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f2d55"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css?v=20260921-target2"><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><title>MANTENLO — Cliente</title></head><body><header class="top"><div class="brand">MANT<span>ENLO</span></div><nav class="links"><a class="active" href="cliente.html">Cliente</a><a href="socio.html">Socio</a><a href="admin.html">Admin</a></nav></header><div class="wrap"><div id="app"></div></div><script src="app.js"></script><script>
let step='home',service='',requestId=null,pollTimer=null,currentRequest=null,selectedRating=0,ratingSending=false,ratingCommentDraft='',serviceTiming='now',scheduledDate='',timeFrom='',timeTo='',selectedSlot='';
const problemsByService={
'Plomería':['Fuga de agua','WC / taza','Lavabo o fregadero','Tubería tapada','Baja presión','Otro problema'],
'Electricidad':['Apagón parcial','Contacto sin corriente','Corto / chispas','Interruptor o apagador','Instalación eléctrica','Otro problema'],
'Boiler':['No enciende','No calienta','Fuga de agua','Olor o fuga de gas','Piloto se apaga','Mantenimiento','Otro problema'],
'Cerrajería':['Me quedé fuera','Llave rota o atorada','Cambiar cerradura','Reparar cerradura','Duplicado / cambio de llave','Otro problema'],
'Aire acondicionado':['No enfría','No enciende','Tira agua','Hace ruido','Instalación','Mantenimiento','Otro problema']};
function serviceIcon(s){const m={'Plomería':'wrench','Electricidad':'zap','Boiler':'flame','Cerrajería':'key-round','Aire acondicionado':'snowflake','Otro':'circle-plus'};return `<i data-lucide="${m[s]||'wrench'}"></i>`}
function serviceProblems(){return problemsByService[service]||[]}
function detailExample(){const x={Plomería:'Ej. El WC pierde agua desde esta mañana.',Electricidad:'Ej. Los contactos de la cocina dejaron de funcionar.',Boiler:'Ej. El boiler enciende pero el agua no calienta.',Cerrajería:'Ej. La llave se rompió dentro de la cerradura.','Aire acondicionado':'Ej. El equipo enciende pero no enfría.',Otro:'Describe con el mayor detalle posible qué necesitas resolver.'};return x[service]||''}
function render(){let app=document.getElementById('app'),c='';if(step==='home')c=`<div class="phone home-screen"><div class="main"><section class="hero"><div class="status"><span class="status-dot"></span>Servicio bajo demanda</div><h1 class="title">¿Qué necesitas<br>resolver?</h1><p class="subtitle">Encuentra un profesional verificado disponible cerca de ti.</p></section><div class="grid service-grid">${serviceOptions()}</div><section class="trust-card house-banner"><div class="house-art"><img src="casa-mantenlo.png" alt=""></div><div class="house-copy"><b>Tu hogar en buenas manos</b><span>Profesionales verificados, rápidos y de confianza.</span></div></section><div class="trust-row"><div><i data-lucide="badge-check"></i><b>Verificados</b><span>Profesionales<br>de confianza</span></div><div><i data-lucide="clock-3"></i><b>Atención rápida</b><span>Cuando lo<br>necesites</span></div><div><i data-lucide="shield-check"></i><b>Servicio seguro</b><span>Tu tranquilidad<br>primero</span></div></div></div></div>`;
if(step==='service'){const probs=serviceProblems();c=`<div class="phone"><div class="main"><button class="back" onclick="go('home')"><i data-lucide="arrow-left"></i> Regresar</button><div class="screen-heading"><div class="heading-icon service-${slugService(service)}">${serviceIcon(service)}</div><div><h1 class="title">${esc(service)}</h1><p class="subtitle">Selecciona el problema.</p></div></div><div class="option-list">${probs.map((x,i)=>`<div class="option choice ${window.problem===x?'selected':''}" onclick="selectProblem(decodeURIComponent('${encodeURIComponent(x)}'),this)"><span>${esc(x)}</span><i data-lucide="chevron-right"></i></div>`).join('')}</div><button class="primary" onclick="continueFromProblem()">Continuar <i data-lucide="arrow-right"></i></button></div></div>`;}
if(step==='detail')c=`<div class="phone"><div class="main"><button class="back" onclick="${service==='Otro'?"go('home')":"go('service')"}"><i data-lucide="arrow-left"></i> Regresar</button><h1 class="title">Cuéntanos qué está pasando</h1><p class="subtitle">${service==='Otro'?'Describe el servicio que necesitas.':`Seleccionaste: <b>${esc(window.problem||'')}</b>`}</p><textarea id="problem" class="textarea" rows="4" placeholder="${esc(detailExample())}">${service==='Otro'?'':esc(window.problem||'')}</textarea><button class="primary" onclick="saveProblemAndGo()">Continuar</button></div></div>`;
if(step==='urgency')c=`<div class="phone"><div class="main"><button class="back" onclick="go('detail')"><i data-lucide="arrow-left"></i> Regresar</button><h1 class="title">¿Cuándo necesitas el servicio?</h1><div class="option" onclick="chooseTiming('now')">🔴 <b>Lo necesito ahora</b><br><span class="pill">Atención inmediata</span></div><div class="option" onclick="chooseTiming('today')">🟠 <b>Hoy, sin urgencia</b><br><span class="pill">Elige un rango de horario</span></div><div class="option" onclick="chooseTiming('scheduled')">🟢 <b>Quiero programarlo</b><br><span class="pill">Elige fecha y horario</span></div></div></div>`;
if(step==='schedule'){const today=new Date();const minDate=localDate(today);const dateValue=serviceTiming==='today'?minDate:(scheduledDate||minDate);const slots=availableSlots(dateValue);c=`<div class="phone"><div class="main"><button class="back" onclick="go('urgency')"><i data-lucide="arrow-left"></i> Regresar</button><div class="screen-heading compact"><div class="heading-icon"><i data-lucide="calendar-days"></i></div><div><h1 class="title">${serviceTiming==='today'?'Elige tu horario':'Programa tu servicio'}</h1><p class="subtitle">Selecciona una fecha y un horario disponible.</p></div></div>${serviceTiming==='scheduled'?`<label class="label">Fecha</label><div class="input-wrap"><i data-lucide="calendar"></i><input id="scheduledDate" class="input" type="date" min="${minDate}" value="${esc(dateValue)}" onchange="scheduledDate=this.value;selectedSlot='';render()"></div>`:''}<div class="slot-heading"><b><i data-lucide="clock-3"></i> Horarios disponibles</b><span>9:00 a.m. a 9:00 p.m.</span></div><div class="slot-grid">${slots.length?slots.map(s=>`<button type="button" class="option slot-option ${selectedSlot===s.from+'|'+s.to?'selected':''}" onclick="selectSlot('${s.from}','${s.to}',this)"><b>${formatHour(s.from)} – ${formatHour(s.to)}</b>${selectedSlot===s.from+'|'+s.to?'<span class="slot-check">✓</span>':''}</button>`).join(''):'<div class="option empty-slot"><b>No quedan horarios disponibles para este día.</b><br><span class="pill">Selecciona otra fecha.</span></div>'}</div><button class="primary" onclick="saveSchedule()">Continuar <i data-lucide="arrow-right"></i></button><p class="helper"><i data-lucide="calendar-clock"></i> Puedes cambiar la fecha o el horario más adelante.</p></div></div>`;}
if(step==='location')c=`<div class="phone"><div class="main"><button class="back" onclick="go('urgency')"><i data-lucide="arrow-left"></i> Regresar</button><h1 class="title">Confirma tu ubicación</h1><div class="map"><div class="pin a">📍</div></div><div class="option"><b>Ubicación de demostración</b><br><span class="pill">Zapopan, Jalisco</span></div><button class="primary" onclick="createAndSearch()">Buscar profesional</button></div></div>`;
if(step==='search')c=`<div class="phone"><div class="main center-space"><div class="bigicon">🔎</div><h1 class="title">Buscando profesional...</h1><p class="subtitle">Tu solicitud ya está guardada en la nube.</p><div class="status">Esperando que un socio la acepte</div><p class="pill">Puedes abrir Socio en otro celular.</p></div></div>`;
if(step==='found'){const r=currentRequest||{},n=r.partners?.name||'Socio MANTENLO';c=`<div class="phone"><div class="main"><div class="status">¡Profesional encontrado!</div><h1 class="title">${esc(n)} está disponible</h1><div class="tech"><div class="avatar">✓</div><div><b>${esc(n)}</b><div class="stars">★ ${esc(r.partners?.rating||'5.0')}</div></div></div><div class="option"><span class="pill">Visita</span><div class="price">${money(r.visit_fee||199)}</div></div><button class="primary" onclick="go('tracking')">Seguir a mi profesional</button></div></div>`}
if(step==='tracking'){const r=currentRequest||{};c=`<div class="phone"><div class="main"><div class="status">${r.status==='arrived'?'Profesional en tu domicilio':'Profesional en camino'}</div><h1 class="title">Seguimiento</h1><div class="map"><div class="pin a">📍</div><div class="pin b">🚗</div><div class="route"></div></div><p class="subtitle">${r.status==='arrived'?'El socio indicó que ya llegó. Espera el diagnóstico y la cotización.':'El socio va en camino. Esta versión ya sincroniza el estado entre dispositivos.'}</p><div class="timeline"><b>✓ Aceptado</b><b>${r.status==='arrived'?'✓':'●'} Llegada</b><b>○ Cotización</b><b>○ Trabajo</b></div></div></div>`}
if(step==='quote'){const r=currentRequest||{},labor=Number(r.labor_amount||0),materials=Number(r.materials_amount||0),total=Number(r.total||labor+materials);c=`<div class="phone"><div class="main"><div class="status">Cotización recibida</div><h1 class="title">Diagnóstico</h1><div class="photo">🔧 Diagnóstico del profesional</div><div class="option"><b>Problema encontrado</b><p>${esc(r.description||r.problem||'Servicio de mantenimiento')}</p></div><div class="cost"><div><span>Visita</span><b>${money(r.visit_fee||199)}</b></div><div><span>Mano de obra</span><b>${money(labor)}</b></div><div><span>Materiales</span><b>${money(materials)}</b></div><div class="total"><span>Total</span><b>${money(total)}</b></div></div><button class="primary" onclick="authorizeWork()">Autorizar trabajo</button><button class="secondary" onclick="rejectQuote()">Rechazar cotización</button><p class="pill" style="text-align:center">Si rechazas la cotización, no se realizará el trabajo y únicamente se cobrará la visita de ${money(r.visit_fee||199)}.</p></div></div>`}
if(step==='authorized')c=`<div class="phone"><div class="main center-space"><div class="bigicon">👍</div><div class="status">Trabajo autorizado</div><h1 class="title">El profesional puede comenzar</h1><p class="subtitle">Te avisaremos cuando el servicio quede terminado.</p><div class="loader"></div></div></div>`;
if(step==='rejected'){const r=currentRequest||{},fee=Number(r.visit_fee||r.total||199);c=`<div class="phone"><div class="main rejected-screen" style="text-align:center"><div class="bigicon rejected-icon"><i data-lucide="x"></i></div><div class="status">Cotización rechazada</div><h1 class="title">No se realizará el trabajo</h1><p class="subtitle">Únicamente se cobrará el servicio de visita.</p><div class="option rejected-total"><span class="pill">Total por visita</span><div class="price">${money(fee)}</div></div><button class="primary" onclick="finishRejectedService()">Solicitar otro servicio <i data-lucide="arrow-right"></i></button></div></div>`}
if(step==='done'){const r=currentRequest||{};c=`<div class="phone"><div class="main" style="text-align:center"><div class="bigicon">✅</div><h1 class="title">¡Servicio terminado!</h1><p class="subtitle">Total del servicio: <b>${money(r.total||0)}</b></p><div class="rating-box"><p><b>¿Cómo fue tu experiencia?</b></p><div class="rating-stars interactive" aria-label="Calificación de 1 a 5">${[1,2,3,4,5].map(n=>`<button type="button" class="star ${n<=selectedRating?'on':''}" onclick="setRating(${n})" aria-label="${n} estrellas">★</button>`).join('')}</div><p class="pill">${selectedRating?`Seleccionaste ${selectedRating} de 5 estrellas.`:'Toca las estrellas para calificar.'}</p><textarea id="ratingComment" class="textarea" rows="3" maxlength="300" placeholder="Comentario opcional" oninput="ratingCommentDraft=this.value">${esc(ratingCommentDraft)}</textarea></div><button class="primary" ${ratingSending?'disabled':''} onclick="submitRating()">${ratingSending?'Guardando...':'Enviar calificación y finalizar'}</button><button class="secondary" ${ratingSending?'disabled':''} onclick="resetApp()">Omitir calificación</button></div></div>`}app.innerHTML=c;if(window.lucide)lucide.createIcons()}
function localDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function availableSlots(dateStr){const slots=[];for(let h=9;h<21;h+=2)slots.push({from:String(h).padStart(2,'0')+':00',to:String(Math.min(h+2,21)).padStart(2,'0')+':00'});const now=new Date();if(dateStr===localDate(now))return slots.filter(s=>Number(s.from.slice(0,2))>now.getHours()||(Number(s.from.slice(0,2))===now.getHours()&&0>now.getMinutes()));return slots}
function formatHour(t){let h=Number(t.slice(0,2)),m=t.slice(3),ap=h>=12?'p.m.':'a.m.';let hh=h%12||12;return `${hh}:${m} ${ap}`}
function selectSlot(from,to,el){timeFrom=from;timeTo=to;selectedSlot=from+'|'+to;document.querySelectorAll('.slot-option').forEach(x=>x.classList.remove('selected'));if(el)el.classList.add('selected')}
function chooseTiming(type){serviceTiming=type;selectedSlot='';if(type==='now'){scheduledDate='';timeFrom='';timeTo='';go('location');return}if(type==='today')scheduledDate=localDate(new Date());go('schedule')}
function saveSchedule(){if(serviceTiming==='scheduled'){const d=document.getElementById('scheduledDate')?.value;if(!d){alert('Selecciona la fecha del servicio.');return}scheduledDate=d}else scheduledDate=localDate(new Date());if(!timeFrom||!timeTo||!selectedSlot){alert('Selecciona uno de los horarios disponibles.');return}go('location')}function chooseService(s){service=s;if(s==='Otro'){window.problem='';go('detail');return}const probs=serviceProblems();window.problem=probs[0]||'';go('service')}function selectProblem(x,el){document.querySelectorAll('.option').forEach(e=>e.classList.remove('selected'));el.classList.add('selected');window.problem=x}function continueFromProblem(){if(service==='Boiler'&&window.problem==='Olor o fuga de gas'){alert('⚠️ Si percibes olor a gas: cierra la llave de gas si puedes hacerlo con seguridad, ventila el área, evita encender o apagar interruptores y aléjate si el olor es intenso. Si existe riesgo inmediato, contacta a los servicios de emergencia o a tu proveedor de gas.');}go('detail')}function saveProblemAndGo(){const v=document.getElementById('problem').value.trim();if(!v){alert('Describe brevemente qué necesitas resolver.');return}window.problem=v;go('urgency')}function go(s){step=s;render()}
async function createAndSearch(){try{let r=await newRequest(service,window.problem);if(serviceTiming!=='now'){r=await updateRequest(r.id,{service_timing:serviceTiming,scheduled_date:scheduledDate,time_from:timeFrom,time_to:timeTo})}else{r=await updateRequest(r.id,{service_timing:'now',scheduled_date:null,time_from:null,time_to:null})}requestId=r.id;localStorage.setItem('mantenlo_active_request_id',requestId);currentRequest=r;go('search');startPolling()}catch(e){alert('No se pudo crear la solicitud: '+e.message)}}
function startPolling(){clearInterval(pollTimer);pollTimer=setInterval(checkStatus,2000);checkStatus()}
async function checkStatus(){if(!requestId)return;try{const r=await getRequest(requestId);if(!r)return;currentRequest=r;if(r.status==='completed'){clearInterval(pollTimer);pollTimer=null;step='done'}else if(r.status==='quote_rejected'){clearInterval(pollTimer);pollTimer=null;step='rejected'}else if(r.status==='quoted'){step='quote'}else if(['authorized','in_progress'].includes(r.status)){step='authorized'}else if(r.status==='arrived'){step='tracking'}else if(r.assigned_partner_id&&r.status!=='searching'){if(!['tracking','quote','authorized'].includes(step))step='found'}else step='search';render()}catch(e){console.error(e)}}
async function authorizeWork(){try{currentRequest=await updateRequest(requestId,{status:'authorized'});step='authorized';render();startPolling()}catch(e){alert('No se pudo autorizar: '+e.message)}}
async function rejectQuote(){if(!requestId||!currentRequest)return;const fee=Number(currentRequest.visit_fee||199);if(!confirm(`¿Rechazar la cotización? El trabajo no se realizará y únicamente se cobrará la visita de ${money(fee)}.`))return;try{currentRequest=await updateRequest(requestId,{status:'quote_rejected',labor_amount:0,materials_amount:0,total:fee});clearInterval(pollTimer);pollTimer=null;step='rejected';render()}catch(e){alert('No se pudo rechazar la cotización: '+e.message)}}
function finishRejectedService(){resetApp()}
function setRating(n){selectedRating=n;document.querySelectorAll('.rating-stars .star').forEach((el,i)=>el.classList.toggle('on',i<n));const p=document.querySelector('.rating-box .pill');if(p)p.textContent=`Seleccionaste ${n} de 5 estrellas.`}
async function submitRating(){if(!selectedRating){alert('Selecciona de 1 a 5 estrellas.');return}if(!requestId||!currentRequest?.assigned_partner_id){alert('No encontramos el servicio o el socio asignado.');return}const comment=ratingCommentDraft;ratingSending=true;render();try{await createRating(requestId,currentRequest.assigned_partner_id,selectedRating,comment);await refreshPartnerRating(currentRequest.assigned_partner_id);alert('¡Gracias! Tu calificación quedó guardada.');resetApp()}catch(e){ratingSending=false;render();const el=document.getElementById('ratingComment');if(el)el.value=comment;alert('No se pudo guardar la calificación: '+e.message)}}
function resetApp(){clearInterval(pollTimer);localStorage.removeItem('mantenlo_active_request_id');requestId=null;currentRequest=null;service='';window.problem='';selectedRating=0;ratingSending=false;ratingCommentDraft='';serviceTiming='now';scheduledDate='';timeFrom='';timeTo='';selectedSlot='';step='home';render()}
async function recoverActiveRequest(){
  try{
    const saved=localStorage.getItem('mantenlo_active_request_id');
    if(!saved){render();return}
    const r=await getRequest(saved);
    if(!r){localStorage.removeItem('mantenlo_active_request_id');render();return}
    requestId=r.id;
    currentRequest=r;
    const st=String(r.status||'').trim().toLowerCase();
    if(st==='completed') step='done';
    else if(st==='quote_rejected') step='rejected';
    else if(st==='quoted') step='quote';
    else if(['authorized','in_progress'].includes(st)) step='authorized';
    else if(st==='arrived') step='tracking';
    else if(r.assigned_partner_id && st!=='searching') step='found';
    else if(st==='cancelled'){localStorage.removeItem('mantenlo_active_request_id');requestId=null;currentRequest=null;step='home'}
    else step='search';
    render();
    if(!['completed','quote_rejected','cancelled'].includes(st)) startPolling();
  }catch(e){
    console.error('No se pudo recuperar el servicio activo',e);
    render();
  }
}
recoverActiveRequest();
</script>
<script>
function serviceOptions(){
  const items=[
    ['Plomería','wrench','Disponible ahora'],
    ['Electricidad','zap','Disponible ahora'],
    ['Boiler','flame','Disponible ahora'],
    ['Cerrajería','key-round','Disponible ahora'],
    ['Aire acondicionado','snowflake','Disponible ahora'],
    ['Otro','circle-plus','Cuéntanos qué necesitas']
  ];
  return items.map(([name,icon,sub])=>`
    <button class="service premium-service" onclick="service=decodeURIComponent('${encodeURIComponent(name)}');window.problem='';go('service')">
      <span class="icon service-icon service-${slugService(name)}"><i data-lucide="${icon}"></i></span>
      <span class="service-copy"><b>${name}</b><small>${sub}</small></span>
      <i class="service-chevron" data-lucide="chevron-right"></i>
    </button>`).join('');
}
function slugService(s){return {'Plomería':'plomeria','Electricidad':'electricidad','Boiler':'boiler','Cerrajería':'cerrajeria','Aire acondicionado':'aire','Otro':'otro'}[s]||'otro'}
</script>
</body></html>

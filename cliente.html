<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f2d55"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"><title>MANTENLO — Cliente</title></head><body><header class="top"><div class="brand">MANT<span>ENLO</span></div><nav class="links"><a class="active" href="cliente.html">Cliente</a><a href="socio.html">Socio</a><a href="admin.html">Admin</a></nav></header><div class="wrap"><div id="app"></div></div><script src="app.js"></script><script>
let step='home',service='',requestId=null,pollTimer=null,currentRequest=null,selectedRating=0,ratingSending=false,ratingCommentDraft='',serviceTiming='now',scheduledDate='',timeFrom='',timeTo='';
const problemsByService={
'Plomería':['Fuga de agua','WC / taza','Lavabo o fregadero','Tubería tapada','Baja presión','Otro problema'],
'Electricidad':['Apagón parcial','Contacto sin corriente','Corto / chispas','Interruptor o apagador','Instalación eléctrica','Otro problema'],
'Boiler':['No enciende','No calienta','Fuga de agua','Olor o fuga de gas','Piloto se apaga','Mantenimiento','Otro problema'],
'Cerrajería':['Me quedé fuera','Llave rota o atorada','Cambiar cerradura','Reparar cerradura','Duplicado / cambio de llave','Otro problema'],
'Aire acondicionado':['No enfría','No enciende','Tira agua','Hace ruido','Instalación','Mantenimiento','Otro problema']};
function serviceProblems(){return problemsByService[service]||[]}
function detailExample(){const x={Plomería:'Ej. El WC pierde agua desde esta mañana.',Electricidad:'Ej. Los contactos de la cocina dejaron de funcionar.',Boiler:'Ej. El boiler enciende pero el agua no calienta.',Cerrajería:'Ej. La llave se rompió dentro de la cerradura.','Aire acondicionado':'Ej. El equipo enciende pero no enfría.',Otro:'Describe con el mayor detalle posible qué necesitas resolver.'};return x[service]||''}
function render(){let app=document.getElementById('app'),c='';if(step==='home')c=`<div class="phone"><div class="main"><div class="status">Servicio bajo demanda</div><h1 class="title">¿Qué necesitas resolver?</h1><p class="subtitle">Encuentra un profesional disponible cerca de ti.</p><div class="grid">${serviceOptions()}</div></div></div>`;
if(step==='service'){const probs=serviceProblems();c=`<div class="phone"><div class="main"><button class="back" onclick="go('home')">← Regresar</button><h1 class="title">${esc(service)}</h1><p class="subtitle">Selecciona el problema.</p>${probs.map((x,i)=>`<div class="option ${window.problem===x?'selected':''}" onclick="selectProblem(decodeURIComponent('${encodeURIComponent(x)}'),this)">${esc(x)}</div>`).join('')}<button class="primary" onclick="continueFromProblem()">Continuar</button></div></div>`;}
if(step==='detail')c=`<div class="phone"><div class="main"><button class="back" onclick="${service==='Otro'?"go('home')":"go('service')"}">← Regresar</button><h1 class="title">Cuéntanos qué está pasando</h1><p class="subtitle">${service==='Otro'?'Describe el servicio que necesitas.':`Seleccionaste: <b>${esc(window.problem||'')}</b>`}</p><textarea id="problem" class="textarea" rows="4" placeholder="${esc(detailExample())}">${service==='Otro'?'':esc(window.problem||'')}</textarea><button class="primary" onclick="saveProblemAndGo()">Continuar</button></div></div>`;
if(step==='urgency')c=`<div class="phone"><div class="main"><button class="back" onclick="go('detail')">← Regresar</button><h1 class="title">¿Cuándo necesitas el servicio?</h1><div class="option" onclick="chooseTiming('now')">🔴 <b>Lo necesito ahora</b><br><span class="pill">Atención inmediata</span></div><div class="option" onclick="chooseTiming('today')">🟠 <b>Hoy, sin urgencia</b><br><span class="pill">Elige un rango de horario</span></div><div class="option" onclick="chooseTiming('scheduled')">🟢 <b>Quiero programarlo</b><br><span class="pill">Elige fecha y horario</span></div></div></div>`;
if(step==='schedule'){const today=new Date();const minDate=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');c=`<div class="phone"><div class="main"><button class="back" onclick="go('urgency')">← Regresar</button><h1 class="title">${serviceTiming==='today'?'¿A qué hora te funciona hoy?':'Programa tu servicio'}</h1>${serviceTiming==='scheduled'?`<label class="label">Fecha</label><input id="scheduledDate" class="input" type="date" min="${minDate}" value="${esc(scheduledDate)}">`:''}<label class="label">Desde</label><input id="timeFrom" class="input" type="time" value="${esc(timeFrom)}"><label class="label">Hasta</label><input id="timeTo" class="input" type="time" value="${esc(timeTo)}"><p class="pill">Indica el rango en el que puedes recibir al profesional.</p><button class="primary" onclick="saveSchedule()">Continuar</button></div></div>`;}
if(step==='location')c=`<div class="phone"><div class="main"><button class="back" onclick="go('urgency')">← Regresar</button><h1 class="title">Confirma tu ubicación</h1><div class="map"><div class="pin a">📍</div></div><div class="option"><b>Ubicación de demostración</b><br><span class="pill">Zapopan, Jalisco</span></div><button class="primary" onclick="createAndSearch()">Buscar profesional</button></div></div>`;
if(step==='search')c=`<div class="phone"><div class="main center-space"><div class="bigicon">🔎</div><h1 class="title">Buscando profesional...</h1><p class="subtitle">Tu solicitud ya está guardada en la nube.</p><div class="status">Esperando que un socio la acepte</div><p class="pill">Puedes abrir Socio en otro celular.</p></div></div>`;
if(step==='found'){const r=currentRequest||{},n=r.partners?.name||'Socio MANTENLO';c=`<div class="phone"><div class="main"><div class="status">¡Profesional encontrado!</div><h1 class="title">${esc(n)} está disponible</h1><div class="tech"><div class="avatar">✓</div><div><b>${esc(n)}</b><div class="stars">★ ${esc(r.partners?.rating||'5.0')}</div></div></div><div class="option"><span class="pill">Visita</span><div class="price">${money(r.visit_fee||199)}</div></div><button class="primary" onclick="go('tracking')">Seguir a mi profesional</button></div></div>`}
if(step==='tracking'){const r=currentRequest||{};c=`<div class="phone"><div class="main"><div class="status">${r.status==='arrived'?'Profesional en tu domicilio':'Profesional en camino'}</div><h1 class="title">Seguimiento</h1><div class="map"><div class="pin a">📍</div><div class="pin b">🚗</div><div class="route"></div></div><p class="subtitle">${r.status==='arrived'?'El socio indicó que ya llegó. Espera el diagnóstico y la cotización.':'El socio va en camino. Esta versión ya sincroniza el estado entre dispositivos.'}</p><div class="timeline"><b>✓ Aceptado</b><b>${r.status==='arrived'?'✓':'●'} Llegada</b><b>○ Cotización</b><b>○ Trabajo</b></div></div></div>`}
if(step==='quote'){const r=currentRequest||{},labor=Number(r.labor_amount||0),materials=Number(r.materials_amount||0),total=Number(r.total||labor+materials);c=`<div class="phone"><div class="main"><div class="status">Cotización recibida</div><h1 class="title">Diagnóstico</h1><div class="photo">🔧 Diagnóstico del profesional</div><div class="option"><b>Problema encontrado</b><p>${esc(r.description||r.problem||'Servicio de mantenimiento')}</p></div><div class="cost"><div><span>Visita</span><b>${money(r.visit_fee||199)}</b></div><div><span>Mano de obra</span><b>${money(labor)}</b></div><div><span>Materiales</span><b>${money(materials)}</b></div><div class="total"><span>Total</span><b>${money(total)}</b></div></div><button class="primary" onclick="authorizeWork()">Autorizar trabajo</button><p class="pill" style="text-align:center">El trabajo no inicia hasta que lo autorices.</p></div></div>`}
if(step==='authorized')c=`<div class="phone"><div class="main center-space"><div class="bigicon">👍</div><div class="status">Trabajo autorizado</div><h1 class="title">El profesional puede comenzar</h1><p class="subtitle">Te avisaremos cuando el servicio quede terminado.</p><div class="loader"></div></div></div>`;
if(step==='done'){const r=currentRequest||{};c=`<div class="phone"><div class="main" style="text-align:center"><div class="bigicon">✅</div><h1 class="title">¡Servicio terminado!</h1><p class="subtitle">Total del servicio: <b>${money(r.total||0)}</b></p><div class="rating-box"><p><b>¿Cómo fue tu experiencia?</b></p><div class="rating-stars interactive" aria-label="Calificación de 1 a 5">${[1,2,3,4,5].map(n=>`<button type="button" class="star ${n<=selectedRating?'on':''}" onclick="setRating(${n})" aria-label="${n} estrellas">★</button>`).join('')}</div><p class="pill">${selectedRating?`Seleccionaste ${selectedRating} de 5 estrellas.`:'Toca las estrellas para calificar.'}</p><textarea id="ratingComment" class="textarea" rows="3" maxlength="300" placeholder="Comentario opcional" oninput="ratingCommentDraft=this.value">${esc(ratingCommentDraft)}</textarea></div><button class="primary" ${ratingSending?'disabled':''} onclick="submitRating()">${ratingSending?'Guardando...':'Enviar calificación y finalizar'}</button><button class="secondary" ${ratingSending?'disabled':''} onclick="resetApp()">Omitir calificación</button></div></div>`}app.innerHTML=c}
function chooseTiming(type){serviceTiming=type;if(type==='now'){scheduledDate='';timeFrom='';timeTo='';go('location');return}go('schedule')}function saveSchedule(){if(serviceTiming==='scheduled'){const d=document.getElementById('scheduledDate').value;if(!d){alert('Selecciona la fecha del servicio.');return}scheduledDate=d}else{const now=new Date();scheduledDate=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')}timeFrom=document.getElementById('timeFrom').value;timeTo=document.getElementById('timeTo').value;if(!timeFrom||!timeTo){alert('Selecciona el horario desde y hasta.');return}if(timeTo<=timeFrom){alert('La hora final debe ser posterior a la hora inicial.');return}go('location')}function chooseService(s){service=s;if(s==='Otro'){window.problem='';go('detail');return}const probs=serviceProblems();window.problem=probs[0]||'';go('service')}function selectProblem(x,el){document.querySelectorAll('.option').forEach(e=>e.classList.remove('selected'));el.classList.add('selected');window.problem=x}function continueFromProblem(){if(service==='Boiler'&&window.problem==='Olor o fuga de gas'){alert('⚠️ Si percibes olor a gas: cierra la llave de gas si puedes hacerlo con seguridad, ventila el área, evita encender o apagar interruptores y aléjate si el olor es intenso. Si existe riesgo inmediato, contacta a los servicios de emergencia o a tu proveedor de gas.');}go('detail')}function saveProblemAndGo(){const v=document.getElementById('problem').value.trim();if(!v){alert('Describe brevemente qué necesitas resolver.');return}window.problem=v;go('urgency')}function go(s){step=s;render()}
async function createAndSearch(){try{let r=await newRequest(service,window.problem);if(serviceTiming!=='now'){r=await updateRequest(r.id,{service_timing:serviceTiming,scheduled_date:scheduledDate,time_from:timeFrom,time_to:timeTo})}else{r=await updateRequest(r.id,{service_timing:'now',scheduled_date:null,time_from:null,time_to:null})}requestId=r.id;currentRequest=r;go('search');startPolling()}catch(e){alert('No se pudo crear la solicitud: '+e.message)}}
function startPolling(){clearInterval(pollTimer);pollTimer=setInterval(checkStatus,2000);checkStatus()}
async function checkStatus(){if(!requestId)return;try{const r=await getRequest(requestId);if(!r)return;currentRequest=r;if(r.status==='completed'){clearInterval(pollTimer);pollTimer=null;step='done'}else if(r.status==='quoted'){step='quote'}else if(['authorized','in_progress'].includes(r.status)){step='authorized'}else if(r.status==='arrived'){step='tracking'}else if(r.assigned_partner_id&&r.status!=='searching'){if(!['tracking','quote','authorized'].includes(step))step='found'}else step='search';render()}catch(e){console.error(e)}}
async function authorizeWork(){try{currentRequest=await updateRequest(requestId,{status:'authorized'});step='authorized';render();startPolling()}catch(e){alert('No se pudo autorizar: '+e.message)}}
function setRating(n){selectedRating=n;document.querySelectorAll('.rating-stars .star').forEach((el,i)=>el.classList.toggle('on',i<n));const p=document.querySelector('.rating-box .pill');if(p)p.textContent=`Seleccionaste ${n} de 5 estrellas.`}
async function submitRating(){if(!selectedRating){alert('Selecciona de 1 a 5 estrellas.');return}if(!requestId||!currentRequest?.assigned_partner_id){alert('No encontramos el servicio o el socio asignado.');return}const comment=ratingCommentDraft;ratingSending=true;render();try{await createRating(requestId,currentRequest.assigned_partner_id,selectedRating,comment);await refreshPartnerRating(currentRequest.assigned_partner_id);alert('¡Gracias! Tu calificación quedó guardada.');resetApp()}catch(e){ratingSending=false;render();const el=document.getElementById('ratingComment');if(el)el.value=comment;alert('No se pudo guardar la calificación: '+e.message)}}
function resetApp(){clearInterval(pollTimer);requestId=null;currentRequest=null;service='';window.problem='';selectedRating=0;ratingSending=false;ratingCommentDraft='';serviceTiming='now';scheduledDate='';timeFrom='';timeTo='';step='home';render()}render();
</script></body></html>

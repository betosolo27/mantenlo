<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f2d55"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"><title>MANTENLO — Cliente</title></head><body><header class="top"><div class="brand">MANT<span>ENLO</span></div><nav class="links"><a class="active" href="cliente.html">Cliente</a><a href="socio.html">Socio</a><a href="admin.html">Admin</a></nav></header><div class="wrap"><div id="app"></div></div><script src="app.js"></script><script>
let step='home',service='';
function render(){let app=document.getElementById('app'),c='';if(step==='home')c=`<div class="phone"><div class="main"><div class="status">Servicio bajo demanda</div><h1 class="title">¿Qué necesitas resolver?</h1><p class="subtitle">Encuentra un profesional disponible cerca de ti.</p><div class="grid">${serviceOptions()}</div><button class="primary" onclick="chooseService('Plomería')">Lo necesito ahora</button></div></div>`;
if(step==='service')c=`<div class="phone"><div class="main"><button class="back" onclick="go('home')">← Regresar</button><h1 class="title">${esc(service)}</h1><p class="subtitle">Selecciona el problema.</p>${['Fuga de agua','Llave o grifo','WC','Drenaje','Tubería','Otro'].map((x,i)=>`<div class="option ${i===0?'selected':''}" onclick="selectProblem('${x}',this)">${x}</div>`).join('')}<button class="primary" onclick="go('detail')">Continuar</button></div></div>`;
if(step==='detail')c=`<div class="phone"><div class="main"><button class="back" onclick="go('service')">← Regresar</button><h1 class="title">Describe el problema</h1><div class="photo">📷 Foto del problema (demo)</div><textarea id="problem" class="textarea" rows="4">Hay una fuga de agua debajo del lavabo.</textarea><button class="secondary">📷 Agregar foto</button><button class="secondary">🎥 Agregar video</button><button class="primary" onclick="go('urgency')">Continuar</button></div></div>`;
if(step==='urgency')c=`<div class="phone"><div class="main"><button class="back" onclick="go('detail')">← Regresar</button><h1 class="title">¿Qué tan urgente es?</h1><div class="option selected" onclick="go('location')">🔴 <b>Lo necesito ahora</b><br><span class="pill">Atención inmediata</span></div><div class="option" onclick="go('location')">🟠 <b>Hoy</b><br><span class="pill">En las próximas horas</span></div><div class="option" onclick="go('location')">🟢 <b>Quiero programarlo</b><br><span class="pill">Elige fecha y hora</span></div></div></div>`;
if(step==='location')c=`<div class="phone"><div class="main"><button class="back" onclick="go('urgency')">← Regresar</button><h1 class="title">Confirma tu ubicación</h1><p class="subtitle">Usaremos tu ubicación para buscar profesionales cercanos.</p><div class="map"><div class="pin a">📍</div></div><div class="option"><b>Ubicación de demostración</b><br><span class="pill">Zapopan, Jalisco</span></div><button class="primary" onclick="createAndSearch()">Buscar profesional</button></div></div>`;
if(step==='search')c=`<div class="phone"><div class="main" style="text-align:center;padding-top:110px"><div style="font-size:60px">🔎</div><h1 class="title">Buscando profesional...</h1><p class="subtitle">La solicitud ya fue registrada en MANTENLO.</p><div class="status">Buscando socio disponible</div><button class="secondary" onclick="go('found')">Simular profesional encontrado</button></div></div>`;
if(step==='found')c=`<div class="phone"><div class="main"><div class="status">¡Profesional encontrado!</div><h1 class="title">Carlos está disponible</h1><div class="tech"><div class="avatar">CH</div><div><b>Carlos Hernández</b><div class="stars">★ 4.9</div><div class="pill">Plomero MANTENLO · 187 servicios</div></div></div><div class="option">📍 2.1 km<br><span class="pill">Llegada estimada: 24 min</span></div><div class="option"><span class="pill">Visita</span><div class="price">$199</div></div><button class="primary" onclick="advance('En camino','Carlos Hernández',199);go('tracking')">Seguir a mi profesional</button></div></div>`;
if(step==='tracking')c=`<div class="phone"><div class="main"><div class="status">Carlos está en camino · ETA 18 min</div><h1 class="title">Seguimiento</h1><div class="map"><div class="route"></div><div class="pin a">📍</div><div class="pin b">🚗</div></div><div class="tech"><div class="avatar">CH</div><div><b>Carlos Hernández</b><div class="stars">★ 4.9</div></div></div><button class="primary" onclick="advance('Diagnóstico','Carlos Hernández',199);go('diagnosis')">Simular llegada y diagnóstico</button></div></div>`;
if(step==='diagnosis')c=`<div class="phone"><div class="main"><div class="status">Presupuesto listo</div><h1 class="title">Diagnóstico</h1><div class="photo">📷 Evidencia del problema</div><div class="option"><b>Fuga en conexión de tubería</b><br><span class="pill">Reparación propuesta</span></div><div class="option"><span class="pill">Mano de obra</span><div class="price">$600</div><span class="pill">Materiales $180</span></div><div class="option"><span class="pill">Total</span><div class="price">$780</div></div><button class="primary" onclick="advance('Autorizado','Carlos Hernández',780);go('done')">Autorizar trabajo</button><button class="secondary">Cancelar</button></div></div>`;
if(step==='done')c=`<div class="phone"><div class="main" style="text-align:center"><div style="font-size:60px">✅</div><h1 class="title">¡Servicio terminado!</h1><p class="subtitle">Gracias por confiar en MANTENLO.</p><div class="option"><span class="pill">Total</span><div class="price">$780</div></div><h3>¿Cómo fue tu experiencia?</h3><div style="font-size:32px">⭐⭐⭐⭐⭐</div><div class="status">🛡️ Garantía MANTENLO · 30 días</div><button class="primary" onclick="advance('Terminado','Carlos Hernández',780);go('home')">Finalizar</button></div></div>`;app.innerHTML=c}
function chooseService(s){service=s;go('service')}function selectProblem(x,el){document.querySelectorAll('.option').forEach(e=>e.classList.remove('selected'));el.classList.add('selected');window.problem=x}function go(s){step=s;render()}function createAndSearch(){window.requestId=newRequest(service,window.problem||'Problema de mantenimiento');go('search')}function advance(status,tech,amount){if(window.requestId)setRequestStatus(window.requestId,status,tech,amount)}render();
</script></body></html>

<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f2d55"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"><title>MANTENLO — Admin</title></head><body><header class="top"><div class="brand">MANT<span>ENLO</span></div><nav class="links"><a href="cliente.html">Cliente</a><a href="socio.html">Socio</a><a class="active" href="admin.html">Admin</a></nav></header><div class="wrap"><div class="dashboard"><aside class="side"><div class="brand" style="margin-bottom:18px">MANT<span>ENLO</span></div><a class="active">▣ Dashboard</a><a>⚡ Servicios</a><a>👨‍🔧 Socios</a></aside><main class="admin-main"><h1 class="sectionTitle">Dashboard operativo</h1><p class="muted">MANTENLO V1.5 · conectado a Supabase</p><div class="cards"><div class="metric"><span class="muted">Solicitudes</span><div class="n" id="count">0</div></div><div class="metric"><span class="muted">En curso</span><div class="n" id="active">0</div></div><div class="metric"><span class="muted">Socios disponibles</span><div class="n" id="partners">0</div></div></div><div class="table"><div class="row head"><div>Servicio</div><div>Cliente</div><div>Socio</div><div>Estado</div><div>Importe</div></div><div id="rows"></div></div></main></div></div><script src="app.js"></script><script>
async function render(){try{const [rs,ps]=await Promise.all([getRequests(),getPartners()]);document.getElementById('count').textContent=rs.length;document.getElementById('active').textContent=rs.filter(r=>!['completed','cancelled'].includes(r.status)).length;document.getElementById('partners').textContent=ps.filter(p=>p.available).length;document.getElementById('rows').innerHTML=rs.map(r=>`<div class="row"><div><b>${esc(r.category)}</b><br><span class="pill">${esc(r.problem)}</span></div><div>${esc(r.customer_name)}</div><div>${esc(r.partners?.name||'Buscando...')}</div><div><span class="badge">${esc(statusLabel[r.status]||r.status)}</span></div><div><b>${money(r.total||r.visit_fee)}</b></div></div>`).join('')||'<div class="empty">No hay solicitudes.</div>'}catch(e){document.getElementById('rows').innerHTML='<div class="empty">Error de conexión: '+esc(e.message)+'</div>'}}render();setInterval(render,2500);
</script></body></html>

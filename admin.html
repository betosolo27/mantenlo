<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f2d55"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"><title>MANTENLO — Admin</title></head><body><header class="top"><div class="brand">MANT<span>ENLO</span></div><nav class="links"><a href="cliente.html">Cliente</a><a href="socio.html">Socio</a><a class="active" href="admin.html">Admin</a></nav></header><div class="wrap"><div class="dashboard"><aside class="side"><div class="brand" style="margin-bottom:18px">MANT<span>ENLO</span></div><a class="active">▣ Dashboard</a><a>⚡ Servicios</a><a>👨‍🔧 Socios</a><a>👤 Clientes</a><a>💲 Precios</a><a>⚠ Incidencias</a></aside><main class="admin-main"><h1 class="sectionTitle">Dashboard operativo</h1><p class="muted">MVP local · datos compartidos con las otras pantallas</p><div class="cards"><div class="metric"><span class="muted">Solicitudes</span><div class="n" id="count">0</div></div><div class="metric"><span class="muted">En curso</span><div class="n" id="active">0</div></div><div class="metric"><span class="muted">Socios disponibles</span><div class="n">1</div></div><div class="metric"><span class="muted">Calificación demo</span><div class="n">4.82 ⭐</div></div></div><div class="table"><div class="row head"><div>Servicio</div><div>Cliente</div><div>Socio</div><div>Estado</div><div>Importe</div></div><div id="rows"></div></div></main></div></div><script src="app.js"></script><script>
function render(){let db=seed();document.getElementById('count').textContent=db.requests.length;document.getElementById('active').textContent=db.requests.filter(r=>!['Terminado'].includes(r.status)).length;document.getElementById('rows').innerHTML=db.requests.map(r=>`<div class="row"><div><b>${esc(r.service)}</b><br><span class="pill">${esc(r.problem)}</span></div><div>${esc(r.customer)}</div><div>${esc(r.tech||'Buscando...')}</div><div><span class="badge">${esc(r.status)}</span></div><div><b>$${r.amount}</b></div></div>`).join('')||'<div class="empty">No hay solicitudes.</div>'}render();setInterval(render,2000);
</script></body></html>
